[package]
name = "desktop-chat"
version = "0.1.0"
edition = "2021"
description = "Desktop AI client — streaming SSE to any OpenAI-compatible gateway, threads and API key kept out of web storage."
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
